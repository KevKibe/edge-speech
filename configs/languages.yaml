# Canonical language registry, keyed by FLORES-200 code (ISO 639-3 + script).
#
#   name:            human-readable name
#   iso1:            ISO 639-1 code (what most CrispASR backends take via -l); null if none exists
#   space_delimited: false for scripts written without spaces between words. WER is
#                    meaningless there, so the analysis reports CER as the primary metric.
#
# Datasets map their own language keys onto these (see datasets.yaml), so FLEURS
# "sw_ke" and Common Voice "sw" both resolve to swh_Latn.

