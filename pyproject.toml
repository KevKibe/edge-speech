[project]
name = "edge-speech"
version = "0.2.0"
description = "Evaluate CrispASR backends and GGUF models on Hugging Face speech datasets (FLEURS first)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets==3.6.0",
    "huggingface-hub>=0.30",
    "jiwer>=4.0.0",
    "librosa>=0.11.0",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "soundfile>=0.14.0",
]

[project.scripts]
edge-speech-eval = "edge_speech.evaluate:main"
edge-speech-analyze = "edge_speech.analysis:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_speech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
